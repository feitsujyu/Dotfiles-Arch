# Typeless（语音输入）用的设置（kitty.conf 用 include 读入；不用 Typeless 的电脑把 kitty.conf 里那一行注释掉）
#
# Typeless 输入文字时是“放进剪贴板 → 按 Ctrl+V”，而 kitty 的粘贴是 Ctrl+Shift+V，所以这里让 Ctrl+V 也粘贴。
# 窗口里在运行 Neovim 时不这样做，Ctrl+V 原样交给 Neovim（普通模式的矩形选择照常能用；
# 插入模式的 Ctrl+V 由 Neovim 自己粘贴，见 ~/.config/nvim/lua/config/typeless.lua）。
# “在运行 Neovim”是 Neovim 启动时告诉 kitty 的（kitty 的用户变量 in_editor，同一个文件里设置）
map ctrl+v paste_from_clipboard
map --when-focus-on var:in_editor ctrl+v
