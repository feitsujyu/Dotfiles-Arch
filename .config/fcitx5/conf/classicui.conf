# fcitx5 的经典界面（输入框 = 候选词窗口、托盘菜单）的设置

# 主题：~/.local/share/fcitx5/themes/lilac（配合 mango / waybar / kitty 的淡紫色主题）
Theme=lilac
# 不跟着系统的深色 / 浅色切换主题，不用系统的强调色覆盖主题的颜色
UseDarkTheme=False
UseAccentColor=False
# 候选词横着排
Vertical Candidate List=False
# 用鼠标滚轮翻页
WheelForPaging=True

# 字体：大小和 kitty 的 font_size 保持一致
# ※ 下面两行由 ~/.config/mango/scripts/fcitx5-font-sync.sh 自动改写（kitty.conf 改了之后会自动同步），
#   想换字体（不是大小）时，改脚本里的 FAMILY
Font="Noto Sans CJK SC 13"
MenuFont="Noto Sans CJK SC 13"
