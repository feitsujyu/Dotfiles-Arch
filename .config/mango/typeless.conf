# Typeless（语音输入）的 mango 设置（config.conf 用 source= 读入；不用 Typeless 的电脑把 config.conf 里那一行注释掉）
# 其他和 Typeless 有关的文件：
#   scripts/typeless-trigger.py、scripts/typeless-launch.sh、scripts/typeless/（wl-copy / wl-paste 的替身）、
#   scripts/xwayland-workarea.py
#   udev/70-typeless-trigger.rules（要用 sudo 复制到 /etc/udev/rules.d/）
#   ~/.config/kitty/typeless.conf、~/.config/nvim/lua/config/typeless.lua（在 kitty / Neovim 里粘贴识别结果）

# Typeless（语音输入）：日语键盘的单键代替 Typeless 的快捷键（按下 / 松开都传过去）
#   用法：轻按一次开始说话，说完再轻按一次结束（Typeless 的规定：按住不放的话会取消录音，显示快捷键一览）
#   変換 → 听写（RightAlt）、無変換 → Ask Anything（RightAlt+Space）、カタカナひらがな → 翻译模式（RightAlt+RightShift）
#   做法见 mango/scripts/typeless-trigger.py（不需要把用户加入 input 组）
#   同一个键要同时绑定“按下”和“松开”，所以加上 c（允许同一个键有多个绑定），否则 mango 当作冲突
bindc=NONE,Henkan_Mode,spawn,~/.config/mango/scripts/typeless-trigger.py press dictation
bindrc=NONE,Henkan_Mode,spawn,~/.config/mango/scripts/typeless-trigger.py release dictation
bindc=NONE,Muhenkan,spawn,~/.config/mango/scripts/typeless-trigger.py press ask
bindrc=NONE,Muhenkan,spawn,~/.config/mango/scripts/typeless-trigger.py release ask
bindc=NONE,Hiragana_Katakana,spawn,~/.config/mango/scripts/typeless-trigger.py press translate
bindrc=NONE,Hiragana_Katakana,spawn,~/.config/mango/scripts/typeless-trigger.py release translate

# Typeless（语音输入）用的虚拟键盘：常驻，上面的 変換 / 無変換 / カタカナひらがな 键通过它“按”Typeless 的快捷键
exec_once=~/.config/mango/scripts/typeless-trigger.py serve
# X11 程序（XWayland）的“可用区域”设置成屏幕去掉 waybar 的部分：常驻
#   Typeless 按可用区域的最下面放浮动条、Ask Anything 等的卡片，不设置的话会被 waybar 挡住
#   （做法见 scripts/xwayland-workarea.py。对其他 X11 程序也有效）
exec_once=~/.config/mango/scripts/xwayland-workarea.py
# Typeless：mango 启动时在后台启动（不显示窗口）。参数和 Typeless 自己的“开机启动”设置写的一样
#   （Typeless 的“开机启动”写在 ~/.config/autostart/，mango 不读那里，所以在这里启动）
#   通过 typeless-launch.sh 启动：让 Typeless 使用 wl-copy / wl-paste 的替身（见 scripts/typeless/）
exec_once=env TYPELESS_SKIP_SECRET_STORE=1 ~/.config/mango/scripts/typeless-launch.sh --system-startup-silent-launch --password-store=basic

# Typeless 的浮动条：在所有工作区显示（切换工作区时跟着移到当前工作区）
#   用 is_unmanaged_global（不用 is_global）：is_global 的窗口在切换工作区时会抢走焦点，
#   is_unmanaged_global 的窗口不会因为切换工作区、关掉别的窗口、Alt+Tab 得到焦点（用鼠标点还是可以）
# Typeless 的回答卡片（Ask Anything 的回答等）不加规则：出现在当时所在的工作区，之后留在那里
#   （Typeless 每次开始录音时会关掉现有的回答卡片，所以下一次的回答总是在新的窗口、当时所在的工作区里出现）
# Typeless 的浮动条（标题是 Status 的透明窗口，语音输入时在里面显示录音 / 处理进度）：放到 waybar 上方
#   平时由上面的 xwayland-workarea.py 让 Typeless 自己放对位置；这条规则是保险：
#   刚登录时 Typeless 可能在可用区域设置好之前就放好了浮动条
#   offset_y:100 = 可用区域（不包括 waybar）的最下面，水平方向保持居中。窗口出现时生效
# 浮动条不要边框（窗口本身是透明的，边框会画出一个空的框）
window_rule=is_floating:1,is_unmanaged_global:1,no_border:1,offset_y:100,app_id:Typeless-floating-bar
