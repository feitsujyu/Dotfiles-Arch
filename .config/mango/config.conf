# More option see https://github.com/DreamMaoMao/mango/wiki/

# 这台电脑自己的屏幕设置（缩放比例、排列位置）
# 由 waybar 的“设置”弹窗（齿轮图标）写入 local.conf；每台电脑都不一样，所以不放进 dotfiles 仓库
# 没有 local.conf（或里面没有某块屏幕的设置）时：缩放 100%，自动从左往右紧挨着排列
# 保存配置文件后 mango 会自动重新加载（也可以按 SUPER+r），不用重启 mango
source_optional=~/.config/mango/local.conf

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x1f1a3d88

# 小圆角，和 waybar 的胶囊形呼应
border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x1f1a3d33

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
# 关闭和打开对称：400ms，淡出用和淡入相同的曲线（看起来约 0.2 秒）
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.46,1.0,0.29,1
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad（重新加载配置后就生效）
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
# 自然滚动（和 Windows 触摸板默认一样）：双指向上划 → 内容向上移、看到下面的内容
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0

# 触屏 / 触控笔：固定在笔记本内置的屏幕上
#   不设置的话：手指 → 映射到“当前聚焦的屏幕”（聚焦在外接屏时，点内置屏会操作到外接屏，而且位置也对不上）
#              触控笔 → 映射到“所有屏幕合起来的整个范围”
#   type:touch = 所有触屏，type:tablet = 所有触控笔，不用写设备名，换电脑也能用
#   monitor: 是正则表达式，^eDP 是“名字以 eDP 开头”的屏幕（笔记本内置屏的接口一般是 eDP-1、eDP-2…）
#   没有触屏或没有内置屏的电脑上，这两行不起作用，也不会出错
#   外接的触控显示器要单独设置时，用 device_rule=name:<设备名>,... 写一条（name: 优先于 type:）
device_rule=type:touch,monitor:^eDP
device_rule=type:tablet,monitor:^eDP

# Appearance
# 窗口之间 0（边框相贴，聚焦边框更清楚），窗口与屏幕边缘/waybar 之间 2px
gap_inner_horizontal=0
gap_inner_vertical=0
gap_outer_horizontal=2
gap_outer_vertical=2
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=3
# 配色 Lilac：取自 ~/Pictures/background/desktop-background.png
# 格式 0xRRGGBBAA；特殊状态用樱粉/天蓝
root_color=0xe8e8f8ff
# 未聚焦=长春花紫，聚焦=kitty 光标的樱粉色
border_color=0x6c5cc4ff
drop_color=0x9888e855
split_color=0xf5a0c8ff
focus_color=0xf5a0c8ff
maximized_screen_color=0xa898e8ff
urgent_color=0xf07a9aff
scratchpad_color=0x7cc4e0ff
global_color=0xf5a0c8ff
overlay_color=0xc88ce8ff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -show drun
# kitty 总是从主目录（~）打开
#   新程序会继承 mango 的“当前目录”，而 mango 的当前目录就是启动 mango 时终端所在的目录，
#   所以在别的目录里执行 mango 时，kitty 也会从那个目录打开。加上 --directory ~ 就不受影响了
bind=Alt,Return,spawn,kitty --directory ~

# 切换壁纸：~/Pictures/background 里的图片按文件名顺序循环
bind=SUPER,w,spawn_shell,~/.config/mango/scripts/wallpaper.sh next
bind=SUPER+SHIFT,W,spawn_shell,~/.config/mango/scripts/wallpaper.sh prev

# 音量键：每按一次 ±5%，最大 100%（-l 1.0）；静音键切换静音
#   不绑定的话，按键会被交给 kitty，在终端里打出 “439u” / “438u”
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# 屏幕亮度键：Fn + F12 / F11，每次 ±5%（最低 5%），脚本通过 systemd-logind 修改，不需要 sudo
bind=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bind=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
# Wi-Fi 弹窗：wifi-menu（弹窗）和 wifi-menu-catcher（点击外面关闭用的透明层）不用 mango 的动画，
# 由弹窗程序自己做 0.2 秒的淡入淡出（mango 的动画时间是所有窗口共用的设置，没法只给它设成 0.2 秒）
layer_rule=no_animation:1,layer_name:^wifi-menu
# 音量弹窗：和 Wi-Fi 弹窗一样，由程序自己做 0.2 秒的淡入淡出
layer_rule=no_animation:1,layer_name:^volume-menu
# 蓝牙弹窗：同上
layer_rule=no_animation:1,layer_name:^bluetooth-menu
# 亮度弹窗：同上
layer_rule=no_animation:1,layer_name:^brightness-menu
# 设置弹窗：同上
layer_rule=no_animation:1,layer_name:^settings-menu

# 输入法
# kitty、Firefox、GTK 程序通过 Wayland 的 text-input 协议直接使用 fcitx5，不需要设置 GTK_IM_MODULE；
# 下面两个是给 X11（XWayland）程序和 Qt 程序用的
env=XMODIFIERS,@im=fcitx
env=QT_IM_MODULE,fcitx

# 自启动
# exec_once：只在 mango 启动时执行一次；重新加载配置时不会再执行，所以不会重复启动
# （如果写成 exec=，每次重新加载配置都会再启动一个 waybar）
exec_once=waybar
# 壁纸：显示上次用 SUPER+w 切换到的壁纸
exec_once=~/.config/mango/scripts/wallpaper.sh restore
# 输入法：-d 在后台运行，--replace 如果已经有 fcitx5 在运行就替换掉
exec_once=fcitx5 -d --replace
# fcitx5 输入框的字体大小和 kitty 的 font_size 保持一致：先同步一次，之后监视 kitty.conf 的变化
exec_once=~/.config/mango/scripts/fcitx5-font-sync.sh --watch
# Wi-Fi 弹窗：常驻后台，点击 waybar 的 Wi-Fi 模块时马上显示
exec_once=~/.config/waybar/scripts/wifi-popup.py
# 音量弹窗：常驻后台，点击 waybar 的音量模块时马上显示
exec_once=~/.config/waybar/scripts/volume-popup.py
# 蓝牙弹窗：常驻后台，点击 waybar 的蓝牙模块时马上显示；配对请求（PIN 码 / 数字确认）也由它处理
exec_once=~/.config/waybar/scripts/bluetooth-popup.py
# 亮度弹窗：常驻后台，点击 waybar 的亮度模块时马上显示
exec_once=~/.config/waybar/scripts/brightness-popup.py
# 设置弹窗：常驻后台，点击 waybar 的设置模块时马上显示；插上 / 拔掉显示器时按记住的设置重新排列屏幕
exec_once=~/.config/waybar/scripts/settings-popup.py
