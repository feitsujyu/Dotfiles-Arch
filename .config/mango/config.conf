# More option see https://github.com/DreamMaoMao/mango/wiki/

# 显示器缩放（turn 8）
# monitorrule=name:<显示器名>,scale:<倍率>  —— 相当于 Windows 的“缩放”：1.25 = 125%，1.5 = 150%，2 = 200%
# 只写 scale 时，分辨率和刷新率保持不变；没写规则的显示器默认是 100%
# （不过运行中改过倍率的显示器，删掉规则后不会自动恢复，要写回 scale:1 再重载）
# 显示器名可以用 `mmsg get all-monitors` 查看；接到别的接口（比如 HDMI-A-1）时名字会变
# 注意：name 是按“正则表达式”匹配的，而且是部分匹配 —— 只写 DP-1 的话也会匹配到 eDP-1，
#       所以要写成 ^DP-1$（^ 开头、$ 结尾）来精确匹配
# x / y 是显示器的排列位置（逻辑像素）：笔记本屏在左（0,0），外接显示器在右（1920,0）
# 修改后按 SUPER+r 重载配置即可生效，不用重启 mango
monitorrule=name:^eDP-1$,scale:1,x:0,y:0
monitorrule=name:^DP-1$,scale:1.5,x:1920,y:0

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x1f1a3d88

# turn 4：恢复小圆角，和 waybar 的胶囊形呼应（turn 3 为 0，最初为 6）
border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x1f1a3d33

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
# turn 50：关闭改为和打开对称（400ms，淡出用和淡入相同的曲线 → 看起来约 0.2 秒）
# 原设定：animation_duration_close=800
animation_duration_close=400
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
# 原设定（匀速）：animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadeout=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
# turn 72：改为 1（自然滚动，和 Windows 触摸板默认一样：双指向上划 → 内容向上移、看到下面的内容）
# 原设定：trackpad_natural_scrolling=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# 触屏 / 触控笔（turn 64）：固定在平板自己的屏幕（eDP-1）上
#   不设置的话：手指 → 映射到“当前聚焦的屏幕”（接了外接显示器、聚焦在那边时，点平板会操作到外接显示器）
#              触控笔 → 映射到“所有屏幕合起来的整个范围”（平板屏幕的左边对应 eDP-1，右边对应 DP-1）
#   monitor: 后面是正则表达式，写成 ^eDP-1$，以免也匹配到 DP-1（和 turn 6 的 monitorrule 一样）
#   设备名可以用 mmsg watch all-devices 确认
devicerule=name:Wacom HID 484E Finger,monitor:^eDP-1$
devicerule=name:Wacom HID 484E Pen,monitor:^eDP-1$

# Appearance
# turn 4：窗口之间 0（边框相贴，聚焦边框更清楚），窗口与屏幕边缘/waybar 之间 2px
# turn 4 试过：全部为 2 / turn 3：全部为 0
# 最初设定：gappih=5 gappiv=5 gappoh=10 gappov=10
gappih=0
gappiv=0
gappoh=2
gappov=2
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
# turn 4：试用 3（试过 2 和 4；最初设定为 4）
# borderpx=2
# borderpx=4
borderpx=3
# 配色 Lilac：取自 ~/Pictures/background/desktop-background.png
# 格式 0xRRGGBBAA；未聚焦=淡紫半透明，聚焦=长春花紫，特殊状态用樱粉/天蓝
rootcolor=0xe8e8f8ff
# turn 4：未聚焦=原来的聚焦色（长春花紫），聚焦=kitty 光标的樱粉色
# 原设定：bordercolor=0xc8b8e8cc
bordercolor=0x6c5cc4ff
dropcolor=0x9888e855
splitcolor=0xf5a0c8ff
# 原设定：focuscolor=0x6c5cc4ff
focuscolor=0xf5a0c8ff
maximizescreencolor=0xa898e8ff
urgentcolor=0xf07a9aff
scratchpadcolor=0x7cc4e0ff
globalcolor=0xf5a0c8ff
overlaycolor=0xc88ce8ff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# menu and terminal
bind=Alt,space,spawn,rofi -show drun
# turn 21：kitty 总是从主目录（~）打开
#   新程序会继承 mango 的“当前目录”，而 mango 的当前目录就是启动 mango 时终端所在的目录，
#   所以在别的目录里执行 mango 时，kitty 也会从那个目录打开。加上 --directory ~ 就不受影响了
# 原设定：bind=Alt,Return,spawn,kitty
bind=Alt,Return,spawn,kitty --directory ~

# 切换壁纸（turn 11）：~/Pictures/background 里的图片按文件名顺序循环
bind=SUPER,w,spawn_shell,~/.config/mango/scripts/wallpaper.sh next
bind=SUPER+SHIFT,W,spawn_shell,~/.config/mango/scripts/wallpaper.sh prev

# 音量键（turn 34）：每按一次 ±5%，最大 100%（-l 1.0）；静音键切换静音
#   以前没有绑定时，按键会被交给 kitty，在终端里打出 “439u” / “438u”
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# 屏幕亮度键（turn 48）：Fn + F12 / F11，每次 ±5%（最低 5%），脚本通过 systemd-logind 修改，不需要 sudo
bind=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bind=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down

# exit
bind=SUPER,m,quit
bind=ALT,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
# Wi-Fi 弹窗（turn 30）：wifi-menu（弹窗）和 wifi-menu-catcher（点击外面关闭用的透明层）不用 mango 的动画，
# 由弹窗程序自己做 0.2 秒的淡入淡出（mango 的动画时间是所有窗口共用的设置，没法只给它设成 0.2 秒）
layerrule=noanim:1,layer_name:^wifi-menu
# 音量弹窗（turn 34）：和 Wi-Fi 弹窗一样，由程序自己做 0.2 秒的淡入淡出
layerrule=noanim:1,layer_name:^volume-menu
# 蓝牙弹窗（turn 41）：同上
layerrule=noanim:1,layer_name:^bluetooth-menu
# 亮度弹窗（turn 48）：同上
layerrule=noanim:1,layer_name:^brightness-menu

# 输入法（turn 12）
# kitty、Firefox、GTK 程序通过 Wayland 的 text-input 协议直接使用 fcitx5，不需要设置 GTK_IM_MODULE；
# 下面两个是给 X11（XWayland）程序和 Qt 程序用的
env=XMODIFIERS,@im=fcitx
env=QT_IM_MODULE,fcitx

# 自启动（turn 7）
# exec-once：只在 mango 启动时执行一次；按 SUPER+r 重载配置时不会再执行，所以不会重复启动
# （如果写成 exec=，每次重载配置都会再启动一个 waybar / swaybg）
exec-once=waybar
# turn 11：改为由壁纸脚本启动 swaybg，显示上次用 SUPER+w 切换到的壁纸
# 原设定（turn 7）：exec-once=swaybg -i ~/Pictures/background/wallpaper_shubii_03.png -m fill
exec-once=~/.config/mango/scripts/wallpaper.sh restore
# 输入法（turn 12）：-d 在后台运行，--replace 如果已经有 fcitx5 在运行就替换掉
exec-once=fcitx5 -d --replace
# fcitx5 输入框的字体大小和 kitty 的 font_size 保持一致（turn 52）：先同步一次，之后监视 kitty.conf 的变化
exec-once=~/.config/mango/scripts/fcitx5-font-sync.sh --watch
# Wi-Fi 弹窗（turn 30）：常驻后台，点击 waybar 的 Wi-Fi 模块时马上显示
exec-once=~/.config/waybar/scripts/wifi-popup.py
# 音量弹窗（turn 34）：常驻后台，点击 waybar 的音量模块时马上显示
exec-once=~/.config/waybar/scripts/volume-popup.py
# 蓝牙弹窗（turn 41）：常驻后台，点击 waybar 的蓝牙模块时马上显示；配对请求（PIN 码 / 数字确认）也由它处理
exec-once=~/.config/waybar/scripts/bluetooth-popup.py
# 亮度弹窗（turn 48）：常驻后台，点击 waybar 的亮度模块时马上显示
exec-once=~/.config/waybar/scripts/brightness-popup.py
