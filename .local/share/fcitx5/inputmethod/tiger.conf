[InputMethod]
Name=虎码
# 托盘图标（必须写完整路径，~ 不会被展开）
# turn 20：改为 ~/.local/share/icons/input_icon_tiger-code.png
# turn 17：Icon=/home/feitsujyu/Pictures/icon/icon_tiger-code.svg
# 原设定：Icon=fcitx-tiger（系统里没有这个图标，托盘里会显示成白色方块）
Icon=/home/feitsujyu/.local/share/icons/input_icon_tiger-code.png
Label=虎码
LangCode=zh_CN
Addon=table
Configurable=True

[Table]
File=table/tiger.main.dict
AutoSelect=True
AutoSelectLength=-1
NoMatchAutoSelectLength=-1
NoSortInputLength=2
Hint=True
# turn 57：通配键和拼音键对调。原设定：MatchingKey=`（反引号）
MatchingKey=*
# turn 57：反引号 + 拼音 → 显示拼音对应的字和它的虎码编码。原设定：PinyinKey=*
PinyinKey=`
OrderPolicy=No
UseFullWidth=True
QuickPhraseKey=semicolon
AutoPhraseLength=4
SaveAutoPhraseAfter=3
UseContextRelatedOrder=False
QuickPhraseText=ABCDEFGHIJLKLMNOPQRSTUVWXYZ
HintSeparator=

[Table/PrevPage]
0=Up
1=minus

[Table/NextPage]
0=Down
1=equal
