[InputMethod]
Name=虎码
# 托盘图标：只写图标名，会在 ~/.local/share/icons/hicolor/32x32/apps/ 里找 fcitx-tiger.png
Icon=fcitx-tiger
Label=虎码
LangCode=zh_CN
Addon=table
Configurable=True

[Table]
File=table/tiger.main.dict
AutoSelect=True
AutoSelectLength=-1
NoMatchAutoSelectLength=-1
NoSortInputLength=2
Hint=True
# 通配键：* 代替任意一个编码
MatchingKey=*
# 拼音键：反引号 + 拼音 → 显示拼音对应的字和它的虎码编码
PinyinKey=`
OrderPolicy=No
UseFullWidth=True
QuickPhraseKey=semicolon
AutoPhraseLength=4
SaveAutoPhraseAfter=3
UseContextRelatedOrder=False
QuickPhraseText=ABCDEFGHIJLKLMNOPQRSTUVWXYZ
HintSeparator=

[Table/PrevPage]
0=Up
1=minus

[Table/NextPage]
0=Down
1=equal
