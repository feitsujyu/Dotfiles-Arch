# Lilac —— fcitx5 输入框（候选词窗口）的主题
# 和 waybar 的弹窗（Wi-Fi、音量等）、kitty 使用同一套颜色：
#   深靛紫 #1f1a3d（底色） / 粉色 #f5a0c8（边框、选中） / 淡紫 #c9b9f2（文字） /
#   薰衣草 #a898e8（输入中的编码） / 灰 #8e8c9e（编码提示）
# 圆角：fcitx5 的主题没有“圆角半径”的设置，所以背景和高亮用 SVG 图片（panel.svg、highlight.svg），
#       Margin 指定四个角各保留多少像素不拉伸（九宫格拉伸）
# 选择这个主题：~/.config/fcitx5/conf/classicui.conf 的 Theme=lilac

[Metadata]
Name=Lilac
Name[zh_CN]=Lilac（淡紫）
Version=1
Author=feitsujyu
Description=Lilac theme matching mango / waybar / kitty
Description[zh_CN]=配合 mango / waybar / kitty 的淡紫色主题
ScaleWithDPI=True

[InputPanel]
# 普通候选词（候选词前的编号 1. 2. 3. 也用这个颜色）
NormalColor=#c9b9f2
# 选中的候选词：粉色背景（Highlight）上的深紫字
HighlightCandidateColor=#1f1a3d
HighlightCandidateLabelColor=#1f1a3d
HighlightCandidateCommentColor=#3a3470
# 编码提示（虎码的 Hint：候选词后面显示的编码）
CandidateCommentColor=#8e8c9e
# 输入中的编码（虎码的字根）里被强调的部分：薰衣草色，背景透明
HighlightColor=#a898e8
HighlightBackgroundColor=#00000000
# 候选词之间的间距
Spacing=2
EnableBlur=False
FullWidthHighlight=False
PageButtonAlignment=Last Candidate

# 每个候选词的内边距（文字到粉色高亮边缘的距离）
#   Top / Bottom 和高亮框的 Margin 相同，高亮框的下边 = 文字区域的下边
[InputPanel/TextMargin]
Left=8
Right=8
Top=2
Bottom=2

# 整个输入框的内边距（边框到内容的距离；粉色边框 2px + 留白）
#   上下都是 7 → 粉色高亮框到边框的空隙上下各 5px
#   （输入中的编码由程序自己显示在光标处，不在输入框里，所以输入框里只有候选词一行；
#    快速输入等输入框里也显示编码的两行画面，上下的空隙不完全一样）
[InputPanel/ContentMargin]
Left=8
Right=8
Top=7
Bottom=7

[InputPanel/Background]
Image=panel.svg

# 背景图片的九宫格：四个角各 14px 不拉伸（圆角 10px + 边框）
[InputPanel/Background/Margin]
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/Highlight]
Image=highlight.svg

# 高亮框比文字区域向外扩出的距离（同时也是九宫格的边）
[InputPanel/Highlight/Margin]
Left=7
Right=7
Top=2
Bottom=2

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

# ---------- 托盘图标的右键菜单 ----------
[Menu]
NormalColor=#c9b9f2
HighlightCandidateColor=#1f1a3d

[Menu/Background]
Image=panel.svg

[Menu/Background/Margin]
Left=14
Right=14
Top=14
Bottom=14

[Menu/ContentMargin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/Highlight]
Image=menu-highlight.svg

[Menu/Highlight/Margin]
Left=7
Right=7
Top=7
Bottom=7

[Menu/Separator]
Color=#6c5cc480

[Menu/TextMargin]
Left=8
Right=8
Top=5
Bottom=5
